<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>M3 Mobile Россия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Outfit',system-ui,sans-serif;color:#fff;
    background:linear-gradient(160deg,#151960 0%,#1E2171 45%,#2764E2 100%);
    background-attachment:fixed;padding:16px
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 14v12M14 20h12' stroke='%23ffffff' stroke-opacity='0.06' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-size:40px 40px
  }
  .box{
    position:relative;max-width:580px;width:100%;padding:44px 36px;text-align:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);backdrop-filter:blur(6px)
  }
  .brand{font-size:19px;font-weight:700;letter-spacing:.3px;margin-bottom:28px}
  .brand span{color:rgba(255,255,255,.35);font-weight:300}
  h1{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:18px}
  p{font-size:16px;line-height:1.6;color:rgba(255,255,255,.7);margin-bottom:10px}
  .line{width:48px;height:3px;background:#FF644A;border-radius:2px;margin:0 auto 22px}
  @media(max-width:520px){.box{padding:32px 20px}h1{font-size:21px}}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">M3 Mobile <span>Россия</span></div>
    <div class="line"></div>
    <h1>Представительство M3 Mobile в России закрыто</h1>
    <p>С ноября 2026 года сайт не обновляется, заказы и запросы не принимаются.</p>
    <p>Благодарим всех партнёров и клиентов за сотрудничество.</p>
  </div>
</body>
</html>
